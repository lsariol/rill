# cargo-deny: licenses, security advisories and dependency sources.

[advisories]
yanked = "deny"
# Unmaintained crates deep in GPUI's tree aren't ours to replace; only direct dependencies count.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    # The bundled list of trusted root certificates (webpki-roots).
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
