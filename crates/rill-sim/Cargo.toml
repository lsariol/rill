[package]
name = "rill-sim"
description = "Simulated chat traffic for Rill: an adapter for prototyping and benchmarks."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rill-core.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "macros", "sync", "net"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json.workspace = true
tracing.workspace = true
reqwest = { version = "0.13", features = ["json", "gzip"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "test-util"] }

[lints]
workspace = true
