[package]
name = "rill-kick"
description = "Rill's Kick adapter: reads chat from Kick's chat socket (Centrifugo or Pusher)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rill-core.workspace = true
rill-os.workspace = true
rill-emotes.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync", "net", "io-util"] }

[lints]
workspace = true
