[package]
name = "rill-twitch"
description = "Rill's Twitch adapter: device-code sign-in, EventSub chat and Helix actions."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rill-core.workspace = true
rill-os.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync", "net", "io-util"] }

[lints]
workspace = true
