[package]
name = "rill-youtube"
description = "Rill's YouTube adapter: desktop OAuth with PKCE and live chat through the Data API."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rill-core.workspace = true
rill-os.workspace = true
rill-emotes.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "net", "io-util"] }
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-aws-lc", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "server", "router"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"
