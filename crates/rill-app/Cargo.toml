[package]
name = "rill-app"
description = "Rill's native desktop UI, built with GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rill"
path = "src/main.rs"

[dependencies]
rill-core.workspace = true
rill-sim.workspace = true
rill-os.workspace = true
rill-twitch.workspace = true
rill-kick.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
gpui-pre-reqwest-client = "=0.3.9"
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true

[lints]
workspace = true
