# Builds the Windows installer and update files for a version and adds them to its GitHub
# Release. Runs only when a Release is published; it never creates, edits or deletes one.
name: Release files

on:
  release:
    types: [published]

permissions:
  contents: write       # add files to the Release
  id-token: write       # build provenance
  attestations: write

concurrency:
  group: release-files-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: The tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargo = $line.Matches[0].Groups[1].Value
          if ($version -ne $cargo) {
            Write-Host "The tag is $version but Cargo.toml says $cargo. Fix Cargo.toml and release a new version."
            exit 1
          }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Tools
        shell: pwsh
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-about --version 0.9.3 --features cli
          dotnet tool install -g vpk --version 1.3.39-g8d2844f

      - name: Checks
        shell: pwsh
        run: powershell -File scripts/check.ps1

      - name: Build and package
        shell: pwsh
        env:
          RILL_TWITCH_CLIENT_ID: ${{ vars.RILL_TWITCH_CLIENT_ID }}
          RILL_YOUTUBE_CLIENT_ID: ${{ vars.RILL_YOUTUBE_CLIENT_ID }}
          RILL_YOUTUBE_CLIENT_SECRET: ${{ vars.RILL_YOUTUBE_CLIENT_SECRET }}
          RILL_KICK_CLIENT_ID: ${{ vars.RILL_KICK_CLIENT_ID }}
          RILL_KICK_AUTH_HELPER: https://rill.mobasity.com/api/auth
        run: powershell -File scripts/package.ps1 -Version $env:VERSION -Out "$env:GITHUB_WORKSPACE\.dev\releases"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .dev/releases/Rill-win-Setup.exe
            .dev/releases/Rill-win-Portable.zip
            .dev/releases/*.nupkg

      - name: Add the files to the Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem .dev\releases -File).FullName
          gh release upload $env:TAG @files --clobber --repo $env:GITHUB_REPOSITORY
