[package]
name = "rill-rumble"
description = "Rill's Rumble adapter: reads live chat and Rants through Rumble's Live Stream API."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rill-core.workspace = true
rill-os.workspace = true
rill-emotes.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
reqwest = { version = "0.13", features = ["json", "gzip"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[lints]
workspace = true
